<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chang Shu — Portfolio</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111111;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       HOME
    ========================== */

    .home {
      position: relative;

      width: 100vw;
      height: 100vh;
      min-height: 650px;

      overflow: hidden;

      background: #ffffff;
    }


    /* =========================
       HEADER
    ========================== */

    .top-nav {
      position: absolute;

      top: 32px;
      left: 42px;
      right: 42px;

      height: 42px;

      display: flex;
      align-items: center;

      z-index: 50;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.13em;
      text-transform: uppercase;
    }


    /* LOGO */

    .logo {
      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .logo img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .logo:hover {
      opacity: 0.65;
      transform: scale(0.96);
    }


    /* DIVIDER */

    .nav-divider {
      width: 1px;
      height: 28px;

      margin-left: 25px;
      margin-right: 25px;

      background: #d4d4d4;
    }


    /* LOCATION */

    .location {
      white-space: nowrap;

      color: #222222;

      cursor: default;
    }


    /* NAVIGATION */

    .navigation {
      margin-left: auto;

      display: flex;
      align-items: center;

      gap: 46px;
    }

    .navigation a {
      position: relative;

      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.4;
    }


    /* =========================
       COLLAGE
    ========================== */

    .artwork {
      position: absolute;

      left: 5.5%;
      top: 0;
      bottom: 0;

      width: 51%;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      z-index: 1;

      pointer-events: none;
    }

    .artwork img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;

      transform-origin: center bottom;
    }


    /* =========================
       INTRO
    ========================== */

    .intro {
      position: absolute;

      left: 57%;
      top: 50%;

      width: 38%;
      max-width: 700px;

      transform: translateY(-42%);

      z-index: 10;
    }


    /* NAME */

    .name {
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: clamp(72px, 8.2vw, 150px);

      font-weight: 300;

      letter-spacing: -0.065em;
      line-height: 0.88;

      white-space: nowrap;
    }


    /* DISCIPLINE */

    .discipline {
      margin-top: 28px;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.24em;

      text-transform: uppercase;

      white-space: nowrap;
    }


    /* STATEMENT */

    .statement {
      margin-top: 70px;

      width: 100%;
      max-width: 520px;

      font-size: 17px;
      font-weight: 300;

      line-height: 1.55;

      letter-spacing: -0.01em;

      color: #303030;
    }


    /* =========================
       ENTER
    ========================== */

    .enter {
      margin-top: 60px;

      width: 360px;

      display: flex;
      align-items: center;

      cursor: pointer;
    }

    .enter-label {
      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.22em;
    }

    .enter-line {
      flex: 1;

      height: 1px;

      margin-left: 26px;

      background: #222222;
    }

    .arrow {
      margin-left: 16px;

      font-size: 24px;
      font-weight: 300;

      transition: transform 0.3s ease;
    }

    .enter:hover .arrow {
      transform: translateX(8px);
    }


    /* =========================
       YEAR
    ========================== */

    .year-area {
      position: absolute;

      left: 42px;
      bottom: 35px;

      z-index: 10;
    }

    .red-line {
      width: 42px;
      height: 1px;

      margin-bottom: 14px;

      background: #d71920;
    }

    .year {
      font-size: 10px;

      letter-spacing: 0.16em;
    }


    /* =========================
       MEDIUM DESKTOP
    ========================== */

    @media (max-width: 1250px) {

      .artwork {
        left: 2%;
        width: 55%;
      }

      .intro {
        left: 56%;
        width: 40%;
      }

      .name {
        font-size: clamp(68px, 8vw, 110px);
      }

      .statement {
        margin-top: 55px;
      }

      .enter {
        margin-top: 50px;
      }

    }


    /* =========================
       TABLET
    ========================== */

    @media (max-width: 900px) {

      body {
        overflow-y: auto;
      }

      .home {
        height: auto;
        min-height: 100vh;

        overflow: visible;

        display: flex;
        flex-direction: column;

        padding-bottom: 50px;
      }


      /* HEADER */

      .top-nav {
        position: relative;

        top: auto;
        left: auto;
        right: auto;

        height: auto;

        padding: 22px 24px;
      }

      .logo {
        width: 30px;
        height: 30px;
      }

      .nav-divider {
        height: 24px;

        margin-left: 18px;
        margin-right: 18px;
      }

      .location {
        font-size: 9px;
      }

      .navigation {
        gap: 20px;

        font-size: 9px;
      }


      /* ARTWORK */

      .artwork {
        position: relative;

        left: auto;
        top: auto;
        bottom: auto;

        width: 92%;
        height: 72vh;

        min-height: 600px;

        margin: 0 auto;

        align-items: flex-end;
      }

      .artwork img {
        width: 100%;
        height: 100%;

        object-fit: contain;
        object-position: center bottom;
      }


      /* INTRO */

      .intro {
        position: relative;

        left: auto;
        top: auto;

        width: auto;
        max-width: none;

        margin: 60px 24px 0;

        transform: none;
      }

      .name {
        font-size: clamp(68px, 14vw, 120px);

        white-space: normal;
      }

      .discipline {
        white-space: normal;

        line-height: 1.6;
      }

      .statement {
        margin-top: 50px;

        max-width: 480px;

        font-size: 16px;
      }

      .enter {
        width: 100%;
        max-width: 360px;

        margin-top: 45px;
      }

      .year-area {
        position: relative;

        left: auto;
        bottom: auto;

        margin: 90px 24px 0;
      }

    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 650px) {

      .top-nav {
        padding: 20px 18px;
      }

      .logo {
        width: 28px;
        height: 28px;
      }

      .nav-divider {
        display: none;
      }

      .location {
        display: none;
      }

      .navigation {
        gap: 13px;

        font-size: 8px;
      }

      .artwork {
        width: 100%;
        height: 67vh;

        min-height: 500px;
      }

      .intro {
        margin: 45px 18px 0;
      }

      .name {
        font-size: clamp(60px, 19vw, 95px);
      }

      .discipline {
        margin-top: 20px;

        font-size: 9px;
      }

      .statement {
        margin-top: 42px;

        font-size: 15px;

        line-height: 1.55;
      }

      .enter {
        margin-top: 40px;
      }

      .year-area {
        margin-left: 18px;
      }

    }

  </style>
</head>


<body>

  <main class="home">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-nav">


      <!-- LOGO = HOME -->

      <a
        href="index.html"
        class="logo"
        aria-label="Back to homepage"
      >

        <img
          src="logo.png"
          alt="Chang Shu logo"
        >

      </a>


      <!-- DIVIDER -->

      <div class="nav-divider"></div>


      <!-- LOCATION — NOT A LINK -->

      <div class="location">
        New York / Hong Kong
      </div>


      <!-- NAVIGATION -->

      <nav class="navigation">

        <a href="work.html">
          Work
        </a>

        <a href="about.html">
          Information
        </a>

        <a href="contact.html">
          Contact
        </a>

      </nav>

    </header>



    <!-- =========================
         COLLAGE
    ========================== -->

    <div class="artwork">

      <img
        src="homepage-collage.png"
        alt="Chang Shu collage artwork"
      >

    </div>



    <!-- =========================
         INTRO
    ========================== -->

    <section class="intro">

      <h1 class="name">
        Chang Shu
      </h1>


      <p class="discipline">
        Interaction · Digital Media · Visual Art
      </p>


      <p class="statement">
        Between reality and imagination, I build spaces to feel, to question, and to play.
      </p>


      <a
        href="work.html"
        class="enter"
        aria-label="Enter selected work"
      >

        <span class="enter-label">
          ENTER
        </span>

        <span class="enter-line"></span>

        <span class="arrow">
          →
        </span>

      </a>

    </section>



    <!-- =========================
         YEAR
    ========================== -->

    <div class="year-area">

      <div class="red-line"></div>

      <div class="year">
        2026
      </div>

    </div>


  </main>

</body>

</html>
